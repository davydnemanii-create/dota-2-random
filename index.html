
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dota 2 Random Hero</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="background"></div>

    <main class="container">

        <header class="header">
            <h1>DOTA 2 <span>RANDOM</span></h1>
            <p>Случайный выбор героя</p>
        </header>

        <section class="roulette-section">

            <div class="roulette-title">
                <span>✦</span> ВЫБОР ГЕРОЯ <span>✦</span>
            </div>

            <div class="roulette-wrapper">

                <div class="selector"></div>

                <div class="roulette-window">
                    <div class="roulette" id="roulette">
                        <div class="loading">
                            Загрузка героев...
                        </div>
                    </div>
                </div>

            </div>

            <div class="result" id="result">
                <div class="result-image">
                    <img id="winner-image" src="" alt="">
                </div>

                <div class="result-info">
                    <span>ВАШ ГЕРОЙ</span>
                    <h2 id="winner-name">?</h2>
                </div>
            </div>

            <button id="random-button" class="random-button" disabled>
                <span>RANDOM</span>
            </button>

            <p class="hint" id="hint">
                Нажми кнопку, чтобы выбрать случайного героя
            </p>

        </section>

        <footer>
            DOTA 2 RANDOM HERO GENERATOR
        </footer>

    </main>

    <script>
        const API_URL = "https://api.opendota.com/api/heroes";

        const IMAGE_URL =
            "https://cdn.cloudflare.steamstatic.com/apps/dota2/images/dota_react/heroes/";

        const roulette = document.getElementById("roulette");
        const button = document.getElementById("random-button");
        const winnerName = document.getElementById("winner-name");
        const winnerImage = document.getElementById("winner-image");
        const hint = document.getElementById("hint");

        let heroes = [];
        let spinning = false;

        const ITEM_WIDTH = 120;
        const ITEM_GAP = 12;
        const ITEM_SIZE = ITEM_WIDTH + ITEM_GAP;

        // Получаем всех героев Dota 2
        async function loadHeroes() {
            try {
                const response = await fetch(API_URL);

                if (!response.ok) {
                    throw new Error("Не удалось загрузить героев");
                }

                heroes = await response.json();

                if (!heroes.length) {
                    throw new Error("Список героев пуст");
                }

                roulette.innerHTML = "";

                // Показываем героев в начальной ленте
                heroes.forEach(hero => {
                    roulette.appendChild(createHeroCard(hero));
                });

                button.disabled = false;

                hint.textContent =
                    `Загружено героев: ${heroes.length}`;

            } catch (error) {
                console.error(error);

                roulette.innerHTML =
                    '<div class="loading">Ошибка загрузки. Обнови страницу.</div>';

                hint.textContent = "Не удалось загрузить героев Dota 2";
            }
        }

        // Создание карточки героя
        function createHeroCard(hero) {
            const card = document.createElement("div");
            card.className = "hero-card";

            const image = document.createElement("img");

            const internalName = hero.name.replace(
                "npc_dota_hero_", ""
            );

            image.src = IMAGE_URL + internalName + ".png";
            image.alt = hero.localized_name;
            image.loading = "eager";

            const name = document.createElement("span");
            name.textContent = hero.localized_name;

            card.appendChild(image);
            card.appendChild(name);

            return card;
        }

        // Случайный герой
        function getRandomHero() {
            return heroes[Math.floor(Math.random() * heroes.length)];
        }

        // Запуск рулетки
        function startRoulette() {
            if (spinning || heroes.length === 0) return;

            spinning = true;
            button.disabled = true;

            winnerName.textContent = "?";
            winnerImage.src = "";
            hint.textContent = "Выбираем героя...";

            const winner = getRandomHero();

            // Создаём ленту с большим количеством героев
            const items = [];

            const winnerIndex = 55;

            for (let i = 0; i < 75; i++) {
                if (i === winnerIndex) {
                    items.push(winner);
                } else {
                    items.push(getRandomHero());
                }
            }

            roulette.style.transition = "none";
            roulette.style.transform = "translateX(0)";

            roulette.innerHTML = "";

            items.forEach(hero => {
                roulette.appendChild(createHeroCard(hero));
            });

            // Даём браузеру обновить ленту
            roulette.offsetHeight;

            const wrapper = document.querySelector(".roulette-window");

            const wrapperWidth = wrapper.clientWidth;

            const targetPosition =
                winnerIndex * ITEM_SIZE -
                (wrapperWidth / 2) +
                (ITEM_WIDTH / 2);

            // Анимация прокрутки
            roulette.style.transition =
                "transform 6s cubic-bezier(0.12, 0.75, 0.08, 1)";

            roulette.style.transform =
                `translateX(-${targetPosition}px)`;

            // Показываем результат после прокрутки
            setTimeout(() => {
                winnerName.textContent = winner.localized_name;

                const internalName = winner.name.replace(
                    "npc_dota_hero_", ""
                );

                winnerImage.src =
                    IMAGE_URL + internalName + ".png";

                winnerImage.alt = winner.localized_name;

                hint.textContent =
                    "Поздравляем! Ваш случайный герой выбран.";

                spinning = false;
                button.disabled = false;

            }, 6200);
        }

        button.addEventListener("click", startRoulette);

        // Загружаем героев при открытии страницы
        loadHeroes();

    </script>

</body>
</html>
